<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员仪表板 - 汽车服务管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <!-- 确保 dashboard.css 路径正确 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏遮罩层 -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>
        
        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>
                    <i class="fas fa-car"></i>
                    <span>CarService Pro</span>
                </h2>
                <button class="toggle-sidebar" onclick="toggleSidebar()" id="toggleSidebarBtn">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <ul class="sidebar-menu">
                <li class="active" data-page="dashboard">
                    <i class="fas fa-dashboard"></i>
                    <span>仪表板</span>
                </li>
                <li data-page="cars">
                    <i class="fas fa-car"></i>
                    <span>汽车管理</span>
                </li>
                <li data-page="appointments">
                    <i class="fas fa-calendar-check"></i>
                    <span>预约管理</span>
                </li>
                <li data-page="services">
                    <i class="fas fa-tools"></i>
                    <span>服务记录</span>
                </li>
                <li data-page="payments">
                    <i class="fas fa-credit-card"></i>
                    <span>支付记录</span>
                </li>
                <li data-page="reports">
                    <i class="fas fa-chart-bar"></i>
                    <span>数据报表</span>
                </li>
                <li data-page="users">
                    <i class="fas fa-users"></i>
                    <span>用户管理</span>
                </li>
                <li data-page="settings">
                    <i class="fas fa-cog"></i>
                    <span>系统设置</span>
                </li>
            </ul>
        </div>

        <!-- 主内容区 -->
        <div class="main-content" id="mainContent">
            <div class="top-bar">
                <div style="display: flex; align-items: center;">
                    <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="page-title" id="pageTitle">仪表板</span>
                </div>
                
                <div class="user-info">
                    <span class="user-name" id="userName">加载中...</span>
                    <button class="btn btn-danger btn-sm" onclick="logout()">退出</button>
                </div>
            </div>

            <!-- 卡片区域 -->
            <div class="cards-grid">
                <div class="card">
                    <div class="card-info">
                        <h3>总汽车数</h3>
                        <div class="number" id="totalCars">1</div>
                    </div>
                    <div class="card-icon icon-blue"><i class="fas fa-car"></i></div>
                </div>
                <div class="card">
                    <div class="card-info">
                        <h3>待处理服务</h3>
                        <div class="number" id="pendingServices">0</div>
                    </div>
                    <div class="card-icon icon-yellow"><i class="fas fa-tools"></i></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 侧边栏状态
        let sidebarCollapsed = false;
        
        // 切换侧边栏收纳状态
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const toggleBtn = document.getElementById('toggleSidebarBtn');
            
            sidebarCollapsed = !sidebarCollapsed;
            
            if (sidebarCollapsed) {
                sidebar.classList.add('collapsed');
                mainContent.classList.add('expanded');
                toggleBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            } else {
                sidebar.classList.remove('collapsed');
                mainContent.classList.remove('expanded');
                toggleBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
            }
        }
        
        // 移动端切换侧边栏
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('active');
        }
        
        // 关闭移动端侧边栏
        function closeMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.remove('mobile-open');
            overlay.classList.remove('active');
        }
        
        // 登出功能
        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽车服务管理系统 - 专业版</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js 用于图表显示 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fc;
            color: #333;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* 侧边栏导航 */
        .sidebar {
            width: 260px;
            background: #1e293b;
            color: white;
            padding: 20px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid #334155;
        }

        .sidebar-header h2 {
            font-size: 1.5rem;
            color: #fff;
        }

        .sidebar-header p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .nav-menu {
            list-style: none;
            padding: 20px 0;
        }

        .nav-item {
            padding: 12px 25px;
            margin: 5px 0;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #cbd5e1;
        }

        .nav-item:hover {
            background: #334155;
            color: white;
        }

        .nav-item.active {
            background: #3b82f6;
            color: white;
            border-left: 4px solid #fbbf24;
        }

        .nav-item i {
            width: 20px;
            font-size: 1.1rem;
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
        }

        .date-display {
            color: #64748b;
            font-size: 0.9rem;
        }

        /* 卡片样式 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-info h3 {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 8px;
        }

        .card-info .number {
            font-size: 2rem;
            font-weight: 600;
            color: #1e293b;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .icon-blue { background: #dbeafe; color: #3b82f6; }
        .icon-green { background: #dcfce7; color: #22c55e; }
        .icon-yellow { background: #fef9c3; color: #eab308; }
        .icon-red { background: #fee2e2; color: #ef4444; }

        /* 表单样式 */
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .form-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #475569;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-success {
            background: #22c55e;
            color: white;
        }

        .btn-success:hover {
            background: #16a34a;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* 表格样式 */
        .table-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            color: #1e293b;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-pending {
            background: #fef9c3;
            color: #854d0e;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .action-btn.edit {
            background: #dbeafe;
            color: #1e40af;
        }

        .action-btn.delete {
            background: #fee2e2;
            color: #991b1b;
        }

        /* 图表容器 */
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-top: 25px;
        }

        /* 标签页 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .tab.active {
            background: #3b82f6;
            color: white;
        }

        .hidden {
            display: none;
        }

        /* 加载提示 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 侧边栏导航 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>🚗 CarService Pro</h2>
                <p>汽车服务管理系统</p>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-page="dashboard">
                    <i class="fas fa-dashboard"></i>
                    仪表板
                </li>
                <li class="nav-item" data-page="cars">
                    <i class="fas fa-car"></i>
                    汽车管理
                </li>
                <li class="nav-item" data-page="appointments">
                    <i class="fas fa-calendar-check"></i>
                    预约管理
                </li>
                <li class="nav-item" data-page="services">
                    <i class="fas fa-tools"></i>
                    服务记录
                </li>
                <li class="nav-item" data-page="payments">
                    <i class="fas fa-credit-card"></i>
                    支付记录
                </li>
                <li class="nav-item" data-page="reports">
                    <i class="fas fa-chart-bar"></i>
                    数据报表
                </li>
            </ul>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content">
            <div class="top-bar">
                <span class="page-title" id="pageTitle">仪表板</span>
                <span class="date-display" id="currentDate"></span>
            </div>

            <!-- 错误提示 -->
            <div id="errorMessage" class="error" style="display: none;"></div>

            <!-- 各个页面内容将通过 JavaScript 动态加载 -->
            <div id="pageContent"></div>
        </div>
    </div>

    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyAKVNXmMefJWmBfqiKKj3fKHBWaSdKw4LA",
            authDomain: "car-service-managemnt-system.firebaseapp.com",
            projectId: "car-service-managemnt-system",
            storageBucket: "car-service-managemnt-system.firebasestorage.app",
            messagingSenderId: "593184640451",
            appId: "1:593184640451:web:1bc4a0063eaa8c1b0ec176",
            measurementId: "G-MF85T06LC1"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 全局变量
        let currentPage = 'dashboard';
        let charts = {};

        // 显示当前日期
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });

        // 导航切换
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
                currentPage = item.dataset.page;
                document.getElementById('pageTitle').textContent = item.textContent.trim();
                loadPage(currentPage);
            });
        });

        // 显示错误信息
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        // 加载页面内容
        function loadPage(page) {
            const content = document.getElementById('pageContent');
            
            switch(page) {
                case 'dashboard':
                    loadDashboard(content);
                    break;
                case 'cars':
                    loadCarsPage(content);
                    break;
                case 'appointments':
                    loadAppointmentsPage(content);
                    break;
                case 'services':
                    loadServicesPage(content);
                    break;
                case 'payments':
                    loadPaymentsPage(content);
                    break;
                case 'reports':
                    loadReportsPage(content);
                    break;
                default:
                    content.innerHTML = '<div class="loading">页面加载中...</div>';
            }
        }

        // ==================== 仪表板页面 ====================
        function loadDashboard(container) {
            container.innerHTML = `
                <div class="cards-grid" id="dashboardCards">
                    <div class="card">
                        <div class="card-info">
                            <h3>总汽车数</h3>
                            <div class="number" id="totalCars">0</div>
                        </div>
                        <div class="card-icon icon-blue">
                            <i class="fas fa-car"></i>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-info">
                            <h3>今日预约</h3>
                            <div class="number" id="todayAppointments">0</div>
                        </div>
                        <div class="card-icon icon-green">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-info">
                            <h3>待处理服务</h3>
                            <div class="number" id="pendingServices">0</div>
                        </div>
                        <div class="card-icon icon-yellow">
                            <i class="fas fa-tools"></i>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-info">
                            <h3>本月收入</h3>
                            <div class="number" id="monthlyRevenue">¥0</div>
                        </div>
                        <div class="card-icon icon-red">
                            <i class="fas fa-credit-card"></i>
                        </div>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="revenueChart"></canvas>
                </div>

                <div class="table-container" style="margin-top: 25px;">
                    <h3 style="margin-bottom: 15px;">最近预约</h3>
                    <table id="recentAppointments">
                        <thead>
                            <tr>
                                <th>车牌号</th>
                                <th>服务类型</th>
                                <th>预约时间</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="recentAppointmentsBody">
                            <tr><td colspan="4" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            `;

            // 加载仪表板数据
            loadDashboardData();
        }

        async function loadDashboardData() {
            try {
                // 获取总汽车数
                const carsSnapshot = await db.collection('cars').get();
                document.getElementById('totalCars').textContent = carsSnapshot.size;

                // 获取今日预约
                const today = new Date().toISOString().split('T')[0];
                const todayAppointments = await db.collection('appointments')
                    .where('date', '==', today)
                    .get();
                document.getElementById('todayAppointments').textContent = todayAppointments.size;

                // 获取待处理服务
                const pendingServices = await db.collection('services')
                    .where('status', '==', 'pending')
                    .get();
                document.getElementById('pendingServices').textContent = pendingServices.size;

                // 获取本月收入
                const now = new Date();
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
                
                const paymentsSnapshot = await db.collection('payments')
                    .where('date', '>=', firstDay)
                    .where('date', '<=', lastDay)
                    .get();
                
                let monthlyTotal = 0;
                paymentsSnapshot.forEach(doc => {
                    monthlyTotal += doc.data().amount || 0;
                });
                document.getElementById('monthlyRevenue').textContent = `¥${monthlyTotal.toFixed(2)}`;

                // 加载最近预约
                const recentAppointments = await db.collection('appointments')
                    .orderBy('date', 'desc')
                    .limit(5)
                    .get();

                const tbody = document.getElementById('recentAppointmentsBody');
                tbody.innerHTML = '';
                
                recentAppointments.forEach(async (doc) => {
                    const apt = doc.data();
                    // 获取车牌号
                    const carDoc = await db.collection('cars').doc(apt.carId).get();
                    const plate = carDoc.exists ? carDoc.data().plate : '未知';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>${plate}</td>
                            <td>${apt.serviceType}</td>
                            <td>${apt.date} ${apt.time}</td>
                            <td><span class="status-badge status-${apt.status}">${getStatusText(apt.status)}</span></td>
                        </tr>
                    `;
                });

                // 创建收入图表
                createRevenueChart();

            } catch (error) {
                console.error('加载仪表板数据失败:', error);
                showError('加载仪表板数据失败');
            }
        }

        function getStatusText(status) {
            const statusMap = {
                'pending': '待处理',
                'completed': '已完成',
                'cancelled': '已取消'
            };
            return statusMap[status] || status;
        }

        async function createRevenueChart() {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            
            // 获取最近7天的收入
            const labels = [];
            const data = [];
            
            for (let i = 6; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                labels.push(`${date.getMonth()+1}/${date.getDate()}`);
                
                const snapshot = await db.collection('payments')
                    .where('date', '==', dateStr)
                    .get();
                
                let dailyTotal = 0;
                snapshot.forEach(doc => {
                    dailyTotal += doc.data().amount || 0;
                });
                data.push(dailyTotal);
            }

            if (charts.revenue) {
                charts.revenue.destroy();
            }

            charts.revenue = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '每日收入 (¥)',
                        data: data,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: '最近7天收入趋势'
                        }
                    }
                }
            });
        }

        // ==================== 汽车管理页面 ====================
        function loadCarsPage(container) {
            container.innerHTML = `
                <div class="form-container">
                    <h3 class="form-title">添加新汽车</h3>
                    <form id="carForm" class="form-grid">
                        <div class="form-group">
                            <label>车牌号</label>
                            <input type="text" id="plate" placeholder="例如: 京A12345" required>
                        </div>
                        <div class="form-group">
                            <label>车主姓名</label>
                            <input type="text" id="owner" placeholder="车主姓名" required>
                        </div>
                        <div class="form-group">
                            <label>车型</label>
                            <input type="text" id="model" placeholder="例如: 特斯拉Model 3" required>
                        </div>
                        <div class="form-group">
                            <label>联系电话</label>
                            <input type="tel" id="phone" placeholder="手机号码">
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label>备注</label>
                            <textarea id="notes" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">添加汽车</button>
                        </div>
                    </form>
                </div>

                <div class="table-container">
                    <h3 style="margin-bottom: 15px;">汽车列表</h3>
                    <table id="carsTable">
                        <thead>
                            <tr>
                                <th>车牌号</th>
                                <th>车主</th>
                                <th>车型</th>
                                <th>联系电话</th>
                                <th>添加时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="carsTableBody">
                            <tr><td colspan="6" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            `;

            // 绑定表单提交事件
            document.getElementById('carForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const carData = {
                    plate: document.getElementById('plate').value,
                    owner: document.getElementById('owner').value,
                    model: document.getElementById('model').value,
                    phone: document.getElementById('phone').value,
                    notes: document.getElementById('notes').value,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    await db.collection('cars').add(carData);
                    document.getElementById('carForm').reset();
                    loadCarsList();
                    showError('汽车添加成功！');
                } catch (error) {
                    console.error('添加汽车失败:', error);
                    showError('添加汽车失败: ' + error.message);
                }
            });

            // 加载汽车列表
            loadCarsList();
        }

        async function loadCarsList() {
            const tbody = document.getElementById('carsTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="loading">加载中...</td></tr>';

            try {
                const snapshot = await db.collection('cars')
                    .orderBy('createdAt', 'desc')
                    .get();

                tbody.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const car = doc.data();
                    const createdAt = car.createdAt ? new Date(car.createdAt.toDate()).toLocaleString() : '未知';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${car.plate}</strong></td>
                            <td>${car.owner}</td>
                            <td>${car.model}</td>
                            <td>${car.phone || '-'}</td>
                            <td>${createdAt}</td>
                            <td class="action-btns">
                                <button class="action-btn edit" onclick="editCar('${doc.id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="action-btn delete" onclick="deleteCar('${doc.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('加载汽车列表失败:', error);
                tbody.innerHTML = '<tr><td colspan="6" class="error">加载失败</td></tr>';
            }
        }

        // 删除汽车
        window.deleteCar = async (carId) => {
            if (!confirm('确定要删除这辆汽车吗？这将同时删除所有相关记录！')) return;

            try {
                // 删除相关预约
                const appointments = await db.collection('appointments').where('carId', '==', carId).get();
                const batch = db.batch();
                appointments.forEach(doc => batch.delete(doc.ref));
                
                // 删除相关服务

                    <div class="card">
                        <div class="card-info">
                            <h3>平均客单价</h3>
                            <div class="number" id="reportAvgPrice">¥0</div>
                        </div>
                        <div class="card-icon icon-yellow">
                            <i class="fas fa-calculator"></i>
                        </div>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="monthlyReportChart"></canvas>
                </div>

                <div class="chart-container">
                    <canvas id="serviceTypeChart"></canvas>
                </div>
            `;

            loadReportData();
        }

        async function loadReportData() {
            try {
                // 总收入
                const payments = await db.collection('payments')
                    .where('status', '==', 'completed')
                    .get();
                
                let totalRevenue = 0;
                payments.forEach(doc => {
                    totalRevenue += doc.data().amount || 0;
                });
                document.getElementById('reportTotalRevenue').textContent = `¥${totalRevenue.toFixed(2)}`;

                // 总服务次数
                const services = await db.collection('services').get();
                document.getElementById('reportTotalServices').textContent = services.size;

                // 平均客单价
                const avgPrice = services.size > 0 ? totalRevenue / services.size : 0;
                document.getElementById('reportAvgPrice').textContent = `¥${avgPrice.toFixed(2)}`;

                // 创建月度报表
                createMonthlyReport();

                // 创建服务类型分布图
                createServiceTypeChart();

            } catch (error) {
                console.error('加载报表数据失败:', error);
            }
        }

        async function createMonthlyReport() {
            const ctx = document.getElementById('monthlyReportChart').getContext('2d');
            
            // 获取最近6个月的收入
            const labels = [];
            const data = [];
            
            for (let i = 5; i >= 0; i--) {
                const date = new Date();
                date.setMonth(date.getMonth() - i);
                const monthStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                labels.push(`${date.getFullYear()}年${date.getMonth() + 1}月`);
                
                const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).toISOString().split('T')[0];
                const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).toISOString().split('T')[0];
                
                const snapshot = await db.collection('payments')
                    .where('date', '>=', firstDay)
                    .where('date', '<=', lastDay)
                    .where('status', '==', 'completed')
                    .get();
                
                let monthlyTotal = 0;
                snapshot.forEach(doc => {
                    monthlyTotal += doc.data().amount || 0;
                });
                data.push(monthlyTotal);
            }

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '月度收入 (¥)',
                        data: data,
                        backgroundColor: 'rgba(59, 130, 246, 0.5)',
                        borderColor: '#3b82f6',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: '月度收入统计'
                        }
                    }
                }
            });
        }

        async function createServiceTypeChart() {
            const ctx = document.getElementById('serviceTypeChart').getContext('2d');
            
            // 统计各服务类型数量
            const services = await db.collection('services').get();
            const typeCount = {};
            
            services.forEach(doc => {
                const type = doc.data().serviceType;
                typeCount[type] = (typeCount[type] || 0) + 1;
            });

            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(typeCount),
                    datasets: [{
                        data: Object.values(typeCount),
                        backgroundColor: [
                            '#3b82f6',
                            '#22c55e',
                            '#eab308',
                            '#ef4444',
                            '#a855f7',
                            '#ec4899'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: '服务类型分布'
                        }
                    }
                }
            });
        }

        // 初始化加载仪表板
        loadDashboard(document.getElementById('pageContent'));
    </script>
</body>
</html>

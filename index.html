<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 汽车服务管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <style>
        /* 登录方式切换样式 */
        .login-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }
        
        .login-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            color: #64748b;
            font-weight: 500;
            transition: all 0.3s;
            border-radius: 8px 8px 0 0;
        }
        
        .login-tab:hover {
            color: #3b82f6;
            background: #f8fafc;
        }
        
        .login-tab.active {
            color: #3b82f6;
            border-bottom: 3px solid #3b82f6;
            font-weight: 600;
        }
        
        .login-tab i {
            margin-right: 8px;
        }
        
        /* 输入框图标调整 */
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-group .prefix-icon {
            position: absolute;
            left: 15px;
            color: #94a3b8;
            font-size: 1rem;
            z-index: 1;
        }
        
        .input-group .suffix-icon {
            position: absolute;
            right: 15px;
            color: #94a3b8;
            cursor: pointer;
            z-index: 1;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        /* 手机号提示 */
        .phone-hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 5px;
            margin-left: 10px;
        }
        
        .phone-hint i {
            color: #667eea;
            margin-right: 5px;
        }
        
        /* 验证码行 */
        .verification-row {
            display: flex;
            gap: 10px;
        }
        
        .verification-row .form-group {
            flex: 1;
        }
        
        .send-code-btn {
            width: 120px;
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            height: 42px;
            margin-top: 22px;
            white-space: nowrap;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .send-code-btn:hover {
            background: #bfdbfe;
        }
        
        .send-code-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 注册链接 */
        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            margin: 0 10px;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        /* 返回首页 */
        .back-home {
            text-align: center;
            margin-top: 15px;
        }
        
        .back-home a {
            color: #64748b;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .back-home a:hover {
            color: #667eea;
        }
        
        /* 角色提示（小标签） */
        .role-hint {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .role-hint.admin {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .role-hint.customer {
            background: #dcfce7;
            color: #166534;
        }
        
        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .loading-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-car" style="font-size: 3rem; color: #667eea;"></i>
                <h2>汽车服务管理系统</h2>
                <p style="margin-top: 5px;">请输入您的账号登录</p>
            </div>
            
            <div id="loginError" class="alert alert-danger" style="display: none;"></div>
            
            <!-- 登录方式切换 -->
            <div class="login-tabs">
                <div class="login-tab active" onclick="switchLoginMethod('password')" id="tabPassword">
                    <i class="fas fa-lock"></i> 密码登录
                </div>
            
            <!-- 密码登录表单 -->
            <form id="passwordLoginForm" style="display: block;">
                <div class="form-group">
                    <label>账号 <span style="color: #64748b; font-size: 0.85rem;">(邮箱或手机号)</span></label>
                    <div class="input-group">
                        <i class="fas fa-user prefix-icon"></i>
                        <input type="text" id="loginAccount" class="form-control" placeholder="请输入邮箱或手机号" required>
                    </div>
                    <!-- 角色提示（动态显示） -->
                    <div id="accountRoleHint" style="margin-top: 5px; min-height: 20px;"></div>
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <div class="input-group">
                        <i class="fas fa-lock prefix-icon"></i>
                        <input type="password" id="loginPassword" class="form-control" placeholder="请输入密码" required>
                        <i class="fas fa-eye suffix-icon" onclick="togglePassword('loginPassword')"></i>
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember"> 记住我
                    </label>
                    <a href="#" class="forgot-link" onclick="showForgotPassword()">忘记密码？</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="passwordLoginBtn">登录</button>
            </form>
            

    <!-- 忘记密码模态框 -->
    <div class="modal" id="forgotModal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3>重置密码</h3>
                <span class="close" onclick="closeForgotModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="resetError" class="alert alert-danger" style="display: none;"></div>
                <div id="resetSuccess" class="alert alert-success" style="display: none;"></div>
                <form id="resetForm">
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="resetEmail" class="form-control" placeholder="请输入注册邮箱" required>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="submit" class="btn btn-primary" style="flex: 1;">发送重置邮件</button>
                        <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeForgotModal()">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // 当前登录方式
        let currentLoginMethod = 'password';
        let countdown = 60;
        let timer = null;
        let accountCheckTimer = null;

        // 显示/隐藏加载动画
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('show');
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }

            
            // 更新标签样式
            document.getElementById('tabPassword').classList.toggle('active', method === 'password');
            
            // 切换表单显示
            document.getElementById('passwordLoginForm').style.display = method === 'password' ? 'block' : 'none';
            
            // 清空错误信息
            document.getElementById('loginError').style.display = 'none';
        };

        // 实时检查账号角色（密码登录）
        document.getElementById('loginAccount').addEventListener('input', function(e) {
            const account = e.target.value.trim();
            
            if (account.length < 3) {
                document.getElementById('accountRoleHint').innerHTML = '';
                return;
            }
            
            // 设置延迟检查，避免频繁请求
            accountCheckTimer = setTimeout(async () => {
                await checkAccountRole(account);
            }, 500);
        });

        // 检查账号角色
        async function checkAccountRole(account) {
            try {
                let query;
                
                // 判断是邮箱还是手机号
                if (account.includes('@')) {
                    query = db.collection('users').where('email', '==', account);
                } else {
                    query = db.collection('users').where('phone', '==', account);
                }
                
                const snapshot = await query.limit(1).get();
                
                const hintDiv = document.getElementById('accountRoleHint');
                
                if (snapshot.empty) {
                    hintDiv.innerHTML = '<span style="color: #ef4444; font-size: 0.85rem;"><i class="fas fa-exclamation-circle"></i> 账号不存在</span>';
                } else {
                    const userData = snapshot.docs[0].data();
                    const role = userData.role;
                    
                    if (role === 'admin') {
                        hintDiv.innerHTML = '<span class="role-hint admin"><i class="fas fa-user-tie"></i> 管理员账号</span>';
                    } else {
                        hintDiv.innerHTML = '<span class="role-hint customer"><i class="fas fa-user"></i> 车主账号</span>';
                    }
                }
            } catch (error) {
                console.error('检查账号失败:', error);
            }
        }

        // 检查手机号角色
        async function checkPhoneRole(phone) {
            try {
                const snapshot = await db.collection('users')
                    .where('phone', '==', phone)
                    .limit(1)
                    .get();
                
                const hintDiv = document.getElementById('phoneRoleHint');
                
                if (snapshot.empty) {
                    hintDiv.innerHTML = '<span style="color: #ef4444; font-size: 0.85rem;"><i class="fas fa-exclamation-circle"></i> 手机号未注册</span>';
                } else {
                    const userData = snapshot.docs[0].data();
                    const role = userData.role;
                    
                    if (role === 'admin') {
                        hintDiv.innerHTML = '<span class="role-hint admin"><i class="fas fa-user-tie"></i> 管理员账号</span>';
                    } else {
                        hintDiv.innerHTML = '<span class="role-hint customer"><i class="fas fa-user"></i> 车主账号</span>';
                    }
                }
            } catch (error) {
                console.error('检查手机号失败:', error);
            }
        }

        // 密码登录
        document.getElementById('passwordLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const account = document.getElementById('loginAccount').value.trim();
            const password = document.getElementById('loginPassword').value;
            const remember = document.getElementById('remember').checked;
            
            if (!account || !password) {
                showError('请输入账号和密码');
                return;
            }
            
            showLoading();
            
            try {
                let user = null;
                
                // 判断是邮箱还是手机号
                if (account.includes('@')) {
                    // 邮箱登录
                    const userCredential = await auth.signInWithEmailAndPassword(account, password);
                    user = userCredential.user;
                } else {
                    // 手机号登录
                    const userSnapshot = await db.collection('users')
                        .where('phone', '==', account)
                        .limit(1)
                        .get();
                    
                    if (userSnapshot.empty) {
                        throw new Error('手机号未注册');
                    }
                    
                    const userData = userSnapshot.docs[0].data();
                    const userCredential = await auth.signInWithEmailAndPassword(userData.email, password);
                    user = userCredential.user;
                }
                
                await handleLoginSuccess(user, remember);
                
            } catch (error) {
                console.error('Login error:', error);
                handleLoginError(error);
                hideLoading();
            }
        });
        
                // 通过手机号查找用户
                const userSnapshot = await db.collection('users')
                    .where('phone', '==', phone)
                    .limit(1)
                    .get();
                
                if (userSnapshot.empty) {
                    throw new Error('手机号未注册');
                }
                
                const userData = userSnapshot.docs[0].data();
                
                // 这里需要使用 Firebase Phone Auth，但为简化，提示使用密码登录
                showError('请使用密码登录方式登录');
                
                // 自动填充邮箱到密码登录表单
                document.getElementById('loginAccount').value = userData.email;
                switchLoginMethod('password');
                
            } catch (error) {
                console.error('Phone login error:', error);
                showError(error.message);
            } finally {
                hideLoading();
            }
        });

        // 处理登录成功
        async function handleLoginSuccess(user, remember) {
            // 设置持久化
            if (remember) {
                await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
            }
            
            // 获取用户角色
            const userDoc = await db.collection('users').doc(user.uid).get();
            
            if (!userDoc.exists) {
                throw new Error('用户数据不存在');
            }
            
            const userData = userDoc.data();
            
            // 更新最后登录时间
            await db.collection('users').doc(user.uid).update({
                lastLogin: new Date().toISOString()
            });
            
            // 根据角色跳转
            if (userData.role === 'admin') {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'customer-dashboard.html';
            }
        }

        // 处理登录错误
        function handleLoginError(error) {
            let errorMessage = '登录失败';
            
            switch(error.code) {
                case 'auth/user-not-found':
                    errorMessage = '用户不存在';
                    break;
                case 'auth/wrong-password':
                    errorMessage = '密码错误';
                    break;
                case 'auth/invalid-email':
                    errorMessage = '邮箱格式不正确';
                    break;
                case 'auth/invalid-login-credentials':
                    errorMessage = '账号或密码错误';
                    break;
                default:
                    errorMessage = error.message;
            }
            
            showError(errorMessage);
        }


        // 跳转到注册页面
        window.redirectToRegister = function(role) {
            closeRegisterModal();
            if (role === 'admin') {
                window.location.href = 'admin/register.html';
            } else {
                window.location.href = 'customer/register.html';
            }
        };

        // 显示错误
        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
            errorDiv.style.display = 'flex';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // 切换密码显示
        window.togglePassword = function(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling;
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        };

        // 忘记密码
        window.showForgotPassword = function() {
            document.getElementById('forgotModal').classList.add('show');
        };

        window.closeForgotModal = function() {
            document.getElementById('forgotModal').classList.remove('show');
        };

        // 重置密码
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('resetEmail').value;
            
            try {
                await auth.sendPasswordResetEmail(email);
                document.getElementById('resetSuccess').innerHTML = `<i class="fas fa-check-circle"></i> 重置邮件已发送，请检查邮箱`;
                document.getElementById('resetSuccess').style.display = 'flex';
                
                setTimeout(() => {
                    closeForgotModal();
                }, 3000);
                
            } catch (error) {
                console.error('Reset error:', error);
                
                let errorMessage = '发送失败';
                if (error.code === 'auth/user-not-found') {
                    errorMessage = '用户不存在';
                }
                
                document.getElementById('resetError').innerHTML = `<i class="fas fa-exclamation-circle"></i> ${errorMessage}`;
                document.getElementById('resetError').style.display = 'flex';
            }
        });

        // 手机号输入限制
        document.getElementById('loginPhone').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^\d]/g, '').slice(0, 11);
        });

        // 页面加载时检查URL中是否有hash指示
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash === '#register') {
                showRegisterOptions();
            }
        });
    </script>
</body>
</html>

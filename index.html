<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽车服务管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <style>
        .role-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .role-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 250px;
            max-width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .role-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
        }
        
        .role-card i {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .role-card h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #333;
        }
        
        .role-card p {
            color: #666;
            margin-bottom: 20px;
        }
        
        .role-card .btn {
            width: auto;
            padding: 10px 30px;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .brand-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .brand-section h1 {
            font-size: 2.5rem;
            color: #333;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1200px; margin: 50px auto; padding: 0 20px;">
        <div class="brand-section">
            <i class="fas fa-car" style="font-size: 5rem; color: #667eea;"></i>
            <h1>汽车服务管理系统</h1>
            <p style="color: #666; font-size: 1.1rem;">专业的汽车服务管理平台，为车主和商家提供便捷的服务管理体验。</p>
        </div>
        
        <div class="role-container">
            <div class="role-card" onclick="location.href='customer/login.html'">
                <i class="fas fa-user"></i>
                <h2>车主</h2>
                <p>管理您的爱车、预约服务、查看记录</p>
                <button class="btn btn-primary">车主登录</button>
            </div>
            
            <div class="role-card" onclick="location.href='admin/login.html'">
                <i class="fas fa-user-tie"></i>
                <h2>管理员</h2>
                <p>管理车辆、服务、支付、用户</p>
                <button class="btn btn-primary">管理员登录</button>
            </div>
        </div>
        
        <div class="footer">
            <p>还没有账号？ 
                <a href="customer/register.html">车主注册</a> | 
                <a href="admin/register.html">管理员注册</a>
            </p>
        </div>
    </div>
</body>
</html>

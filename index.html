<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽车服务管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        .role-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
        }
        
        .role-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            max-width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .role-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
        }
        
        .role-card i {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .role-card h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #333;
        }
        
        .role-card p {
            color: #666;
            margin-bottom: 20px;
        }
        
        .role-card .btn {
            width: auto;
            padding: 10px 30px;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: white;
        }
        
        .footer a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fas fa-car" style="font-size: 4rem; color: white;"></i>
            <h1 style="color: white; margin-top: 10px;">汽车服务管理系统</h1>
            <p style="color: rgba(255,255,255,0.9);">请选择您的身份登录</p>
        </div>
        
        <div class="role-container">
            <div class="role-card" onclick="location.href='customer/login.html'">
                <i class="fas fa-user"></i>
                <h2>车主</h2>
                <p>管理您的爱车、预约服务、查看记录</p>
                <button class="btn">车主登录</button>
            </div>
            
            <div class="role-card" onclick="location.href='admin/login.html'">
                <i class="fas fa-user-tie"></i>
                <h2>管理员</h2>
                <p>管理车辆、服务、支付、用户</p>
                <button class="btn">管理员登录</button>
            </div>
        </div>
        
        <div class="footer">
            <p>还没有账号？ 
                <a href="customer/register.html">车主注册</a> | 
                <a href="admin/register.html">管理员注册</a>
            </p>
        </div>
    </div>
</body>
</html>

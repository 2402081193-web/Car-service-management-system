<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽车服务管理系统 - 登录注册</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            background: white;
            min-height: 600px;
        }

        /* 左侧品牌区域 */
        .brand-side {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .brand-side::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .brand-content {
            position: relative;
            z-index: 1;
        }

        .brand-icon {
            font-size: 4rem;
            margin-bottom: 30px;
        }

        .brand-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .brand-description {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .feature-list {
            list-style: none;
        }

        .feature-list li {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feature-list li i {
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        /* 右侧表单区域 */
        .form-side {
            flex: 1;
            padding: 60px 50px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .form-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .form-header h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-header p a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .form-header p a:hover {
            text-decoration: underline;
        }

        /* 角色选择器 */
        .role-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .role-option {
            flex: 1;
            max-width: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-option:hover {
            border-color: #667eea;
        }

        .role-option.active {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .role-option i {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 8px;
        }

        .role-option span {
            display: block;
            font-weight: 600;
            color: #333;
        }

        .role-option small {
            font-size: 0.8rem;
            color: #666;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            color: #999;
            font-size: 1.1rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #999;
        }

        /* 表单底部 */
        .form-footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.9rem;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* 按钮 */
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 分割线 */
        .divider {
            margin: 30px 0 20px;
            text-align: center;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            color: #666;
            font-size: 0.9rem;
        }

        /* 社交登录 */
        .social-login {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .social-btn:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-3px);
        }

        /* 错误提示 */
        .error-message {
            background: #fee;
            color: #e53e3e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #fcc;
        }

        .error-message i {
            font-size: 1.1rem;
        }

        /* 成功提示 */
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #a5d6a7;
        }

        /* 切换动画 */
        .fade-enter {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 验证码输入框 */
        .verification-code {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .verification-code input {
            flex: 1;
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .send-code {
            padding: 12px 20px;
            background: #f0f3ff;
            border: 2px solid #667eea;
            border-radius: 10px;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .send-code:hover {
            background: #667eea;
            color: white;
        }

        .send-code:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .brand-side {
                padding: 30px;
            }
            
            .form-side {
                padding: 40px 30px;
            }
        }

        /* 管理员特殊标记 */
        .admin-badge {
            background: #ffd700;
            color: #333;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧品牌展示区 -->
        <div class="brand-side">
            <div class="brand-content">
                <div class="brand-icon">
                    <i class="fas fa-car"></i>
                </div>
                <h1 class="brand-title">汽车服务管理系统</h1>
                <p class="brand-description">
                    专业的汽车服务管理平台，为车主和商家提供便捷的服务管理体验。
                </p>
                <ul class="feature-list">
                    <li>
                        <i class="fas fa-check"></i>
                        <span>车辆信息管理</span>
                    </li>
                    <li>
                        <i class="fas fa-check"></i>
                        <span>预约服务系统</span>
                    </li>
                    <li>
                        <i class="fas fa-check"></i>
                        <span>服务记录追踪</span>
                    </li>
                    <li>
                        <i class="fas fa-check"></i>
                        <span>在线支付管理</span>
                    </li>
                    <li>
                        <i class="fas fa-check"></i>
                        <span>数据统计分析</span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 右侧表单区 -->
        <div class="form-side" id="formSide">
            <!-- 登录表单 -->
            <div id="loginForm" class="fade-enter">
                <div class="form-header">
                    <h2>欢迎回来</h2>
                    <p>还没有账号？ <a href="#" onclick="showRegister()">立即注册</a></p>
                </div>

                <!-- 角色选择 -->
                <div class="role-selector">
                    <div class="role-option active" onclick="selectRole('customer')" id="customerRole">
                        <i class="fas fa-user"></i>
                        <span>车主</span>
                        <small>个人用户</small>
                    </div>
                    <div class="role-option" onclick="selectRole('admin')" id="adminRole">
                        <i class="fas fa-user-tie"></i>
                        <span>管理员</span>
                        <small>商家/员工</small>
                    </div>
                </div>

                <!-- 错误提示 -->
                <div id="loginError" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="loginErrorMessage"></span>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>邮箱 / 手机号</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="text" id="loginEmail" placeholder="请输入邮箱或手机号" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>密码</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder="请输入密码" required>
                            <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword')"></i>
                        </div>
                    </div>

                    <div class="form-footer">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe"> 记住我
                        </label>
                        <a href="#" class="forgot-password" onclick="showForgotPassword()">忘记密码？</a>
                    </div>

                    <button type="submit" class="btn" id="loginBtn">
                        <span>登录</span>
                    </button>

                    <div class="divider">
                        <span>或使用</span>
                    </div>

                    <div class="social-login">
                        <div class="social-btn" onclick="socialLogin('wechat')">
                            <i class="fab fa-weixin"></i>
                        </div>
                        <div class="social-btn" onclick="socialLogin('qq')">
                            <i class="fab fa-qq"></i>
                        </div>
                        <div class="social-btn" onclick="socialLogin('google')">
                            <i class="fab fa-google"></i>
                        </div>
                    </div>
                </form>
            </div>

            <!-- 注册表单（初始隐藏） -->
            <div id="registerForm" style="display: none;" class="fade-enter">
                <div class="form-header">
                    <h2>创建账号</h2>
                    <p>已有账号？ <a href="#" onclick="showLogin()">立即登录</a></p>
                </div>

                <!-- 注册角色选择 -->
                <div class="role-selector">
                    <div class="role-option active" onclick="selectRegisterRole('customer')" id="registerCustomerRole">
                        <i class="fas fa-user"></i>
                        <span>车主</span>
                        <small>个人用户</small>
                    </div>
                    <div class="role-option" onclick="selectRegisterRole('admin')" id="registerAdminRole">
                        <i class="fas fa-user-tie"></i>
                        <span>管理员</span>
                        <small>商家/员工</small>
                    </div>
                </div>

                <!-- 错误提示 -->
                <div id="registerError" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="registerErrorMessage"></span>
                </div>

                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>用户名</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="registerName" placeholder="请输入用户名" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>邮箱</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="registerEmail" placeholder="请输入邮箱" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>手机号</label>
                        <div class="input-group">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="registerPhone" placeholder="请输入手机号" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>密码</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="registerPassword" placeholder="请输入密码" required>
                            <i class="fas fa-eye toggle-password" onclick="togglePassword('registerPassword')"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>确认密码</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="registerConfirmPassword" placeholder="请再次输入密码" required>
                            <i class="fas fa-eye toggle-password" onclick="togglePassword('registerConfirmPassword')"></i>
                        </div>
                    </div>

                    <!-- 管理员注册需要邀请码（可选） -->
                    <div id="adminInviteField" style="display: none;">
                        <div class="form-group">
                            <label>管理员邀请码 <span class="admin-badge">管理员专属</span></label>
                            <div class="input-group">
                                <i class="fas fa-key"></i>
                                <input type="text" id="inviteCode" placeholder="请输入邀请码">
                            </div>
                            <small style="color: #999;">联系管理员获取邀请码</small>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="remember-me">
                            <input type="checkbox" id="agreeTerms" required> 我已阅读并同意
                            <a href="#" onclick="showTerms()">《用户协议》</a> 和
                            <a href="#" onclick="showPrivacy()">《隐私政策》</a>
                        </label>
                    </div>

                    <button type="submit" class="btn" id="registerBtn">
                        <span>注册</span>
                    </button>
                </form>
            </div>

            <!-- 忘记密码表单（初始隐藏） -->
            <div id="forgotPasswordForm" style="display: none;" class="fade-enter">
                <div class="form-header">
                    <h2>重置密码</h2>
                    <p><a href="#" onclick="showLogin()">返回登录</a></p>
                </div>

                <div id="resetError" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="resetErrorMessage"></span>
                </div>

                <div id="resetSuccess" class="success-message" style="display: none;">
                    <i class="fas fa-check-circle"></i>
                    <span id="resetSuccessMessage"></span>
                </div>

                <form onsubmit="handleResetPassword(event)">
                    <div class="form-group">
                        <label>邮箱</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="resetEmail" placeholder="请输入注册邮箱" required>
                        </div>
                    </div>

                    <div class="verification-code">
                        <input type="text" id="verificationCode" placeholder="验证码" maxlength="6">
                        <button type="button" class="send-code" id="sendCodeBtn" onclick="sendVerificationCode()">获取验证码</button>
                    </div>

                    <div class="form-group">
                        <label>新密码</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="newPassword" placeholder="请输入新密码" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>确认新密码</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmNewPassword" placeholder="请再次输入新密码" required>
                        </div>
                    </div>

                    <button type="submit" class="btn">确认重置</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyAKVNXmMefJWmBfqiKKj3fKHBWaSdKw4LA",
            authDomain: "car-service-managemnt-system.firebaseapp.com",
            projectId: "car-service-managemnt-system",
            storageBucket: "car-service-managemnt-system.firebasestorage.app",
            messagingSenderId: "593184640451",
            appId: "1:593184640451:web:1bc4a0063eaa8c1b0ec176",
            measurementId: "G-MF85T06LC1"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 当前选中的角色
        let currentLoginRole = 'customer';
        let currentRegisterRole = 'customer';

        // ==================== 界面切换 ====================
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotPasswordForm').style.display = 'none';
            clearErrors();
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('forgotPasswordForm').style.display = 'none';
            clearErrors();
        }

        function showForgotPassword() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotPasswordForm').style.display = 'block';
            clearErrors();
        }

        // 选择登录角色
        function selectRole(role) {
            currentLoginRole = role;
            
            // 更新UI
            document.getElementById('customerRole').classList.toggle('active', role === 'customer');
            document.getElementById('adminRole').classList.toggle('active', role === 'admin');
        }

        // 选择注册角色
        function selectRegisterRole(role) {
            currentRegisterRole = role;
            
            // 更新UI
            document.getElementById('registerCustomerRole').classList.toggle('active', role === 'customer');
            document.getElementById('registerAdminRole').classList.toggle('active', role === 'admin');
            
            // 显示/隐藏管理员邀请码字段
            document.getElementById('adminInviteField').style.display = role === 'admin' ? 'block' : 'none';
        }

        // 清除错误信息
        function clearErrors() {
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('registerError').style.display = 'none';
            document.getElementById('resetError').style.display = 'none';
            document.getElementById('resetSuccess').style.display = 'none';
        }

        // 显示错误
        function showError(elementId, message) {
            const errorDiv = document.getElementById(elementId);
            const messageSpan = document.getElementById(elementId + 'Message');
            messageSpan.textContent = message;
            errorDiv.style.display = 'flex';
        }

        // 显示成功
        function showSuccess(elementId, message) {
            const successDiv = document.getElementById(elementId);
            const messageSpan = document.getElementById(elementId + 'Message');
            messageSpan.textContent = message;
            successDiv.style.display = 'flex';
        }

        // 密码显示切换
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling;
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');

        // ==================== 登录处理 ====================
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');

            // 显示加载状态
            loginBtn.innerHTML = '<span class="loading"></span> 登录中...';
            loginBtn.disabled = true;

            try {
                // 使用 Firebase 认证
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // 从 Firestore 获取用户角色信息
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                if (!userDoc.exists) {
                    throw new Error('用户数据不存在');
                }

                const userData = userDoc.data();
                
                // 验证角色是否匹配
                if (userData.role !== currentLoginRole) {
                    throw new Error(`此账号不是${currentLoginRole === 'admin' ? '管理员' : '车主'}账号`);
                }

                // 记住我功能 - 设置持久化
                if (rememberMe) {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                } else {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
                }

                // 登录成功，根据角色跳转到不同页面
                if (userData.role === 'admin') {
                    window.location.href = 'admin-dashboard.html'; // 管理员后台
                } else {
                    window.location.href = 'customer-dashboard.html'; // 客户中心
                }

            } catch (error) {
                console.error('登录失败:', error);
                
                let errorMessage = '登录失败，请重试';
                switch(error.code) {
                    case 'auth/user-not-found':
                        errorMessage = '用户不存在';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = '密码错误';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = '邮箱格式不正确';
                        break;
                    case 'auth/user-disabled':
                        errorMessage = '账号已被禁用';
                        break;
                    default:
                        errorMessage = error.message;
                }
                
                showError('loginError', errorMessage);
                
                // 恢复按钮
                loginBtn.innerHTML = '<span>登录</span>';
                loginBtn.disabled = false;
            }
        }

        // ==================== 注册处理 ====================
        async function handleRegister(event) {
            event.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const phone = document.getElementById('registerPhone').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            const inviteCode = document.getElementById('inviteCode')?.value;
            
            const registerBtn = document.getElementById('registerBtn');

            // 表单验证
            if (password !== confirmPassword) {
                showError('registerError', '两次输入的密码不一致');
                return;
            }

            if (password.length < 6) {
                showError('registerError', '密码长度至少6位');
                return;
            }

            if (!agreeTerms) {
                showError('registerError', '请同意用户协议和隐私政策');
                return;
            }

            // 管理员注册验证邀请码
            if (currentRegisterRole === 'admin') {
                // 这里可以设置一个固定的邀请码，或者从数据库验证
                if (inviteCode !== 'ADMIN2024') { // 示例邀请码
                    showError('registerError', '管理员邀请码错误');
                    return;
                }
            }

            // 显示加载状态
            registerBtn.innerHTML = '<span class="loading"></span> 注册中...';
            registerBtn.disabled = true;

            try {
                // 创建用户
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // 更新用户资料
                await user.updateProfile({
                    displayName: name
                });

                // 在 Firestore 中保存用户信息
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    name: name,
                    email: email,
                    phone: phone,
                    role: currentRegisterRole,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'active',
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 如果是管理员，可能还需要创建商家信息
                if (currentRegisterRole === 'admin') {
                    await db.collection('shops').doc(user.uid).set({
                        ownerId: user.uid,
                        shopName: name + '的店铺',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        status: 'pending' // 需要审核
                    });
                }

                // 注册成功，自动登录并跳转
                if (currentRegisterRole === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'customer-dashboard.html';
                }

            } catch (error) {
                console.error('注册失败:', error);
                
                let errorMessage = '注册失败，请重试';
                switch(error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = '邮箱已被注册';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = '邮箱格式不正确';
                        break;
                    case 'auth/weak-password':
                        errorMessage = '密码强度太弱';
                        break;
                    default:
                        errorMessage = error.message;
                }
                
                showError('registerError', errorMessage);
                
                // 恢复按钮
                registerBtn.innerHTML = '<span>注册</span>';
                registerBtn.disabled = false;
            }
        }

        // ==================== 重置密码 ====================
        let countdown = 60;
        let timer = null;

        function sendVerificationCode() {
            const email = document.getElementById('resetEmail').value;
            const sendBtn = document.getElementById('sendCodeBtn');
            
            if (!email) {
                showError('resetError', '请输入邮箱');
                return;
            }

            // 模拟发送验证码（实际应该调用 Firebase 的密码重置功能）
            sendBtn.disabled = true;
            sendBtn.textContent = `60秒后重发`;
            
            timer = setInterval(() => {
                countdown--;
                sendBtn.textContent = `${countdown}秒后重发`;
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    sendBtn.disabled = false;
                    sendBtn.textContent = '获取验证码';
                    countdown = 60;
                }
            }, 1000);

            // 模拟发送成功提示
            showSuccess('resetSuccess', '验证码已发送到您的邮箱');
        }

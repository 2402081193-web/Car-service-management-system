<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽车服务管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
    <style>
        /* 角色卡片样式 */
        .role-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .role-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 250px;
            max-width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .role-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
        }
        
        .role-card i {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .role-card h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #333;
        }
        
        .role-card p {
            color: #666;
            margin-bottom: 20px;
        }
        
        .role-card .btn {
            width: auto;
            padding: 10px 30px;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .brand-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .brand-section h1 {
            font-size: 2.5rem;
            color: #333;
            margin: 10px 0;
        }
        
        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .loading-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 容器样式 */
        .login-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="login-container">
        <div class="brand-section">
            <i class="fas fa-car" style="font-size: 5rem; color: #667eea;"></i>
            <h1>汽车服务管理系统</h1>
            <p style="color: #666; font-size: 1.1rem;">专业的汽车服务管理平台，为车主和商家提供便捷的服务管理体验。</p>
        </div>
        
        <div class="role-container">
            <div class="role-card" onclick="location.href='customer/login.html'">
                <i class="fas fa-user"></i>
                <h2>车主</h2>
                <p>管理您的爱车、预约服务、查看记录</p>
                <button class="btn btn-primary">车主登录</button>
            </div>
            
            <div class="role-card" onclick="location.href='admin/login.html'">
                <i class="fas fa-user-tie"></i>
                <h2>管理员</h2>
                <p>管理车辆、服务、支付、用户</p>
                <button class="btn btn-primary">管理员登录</button>
            </div>
        </div>
        
        <div class="footer">
            <p>还没有账号？ 
                <a href="customer/register.html">车主注册</a> | 
                <a href="admin/register.html">管理员注册</a>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyAKVNXmMefJWmBfqiKKj3fKHBWaSdKw4LA",
            authDomain: "car-service-managemnt-system.firebaseapp.com",
            projectId: "car-service-managemnt-system",
            storageBucket: "car-service-managemnt-system.firebasestorage.app",
            messagingSenderId: "593184640451",
            appId: "1:593184640451:web:1bc4a0063eaa8c1b0ec176",
            measurementId: "G-MF85T06LC1"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 检查登录状态
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log('用户已登录:', user.email);
                // 如果已登录，根据角色跳转到对应页面
                db.collection('users').doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const userData = doc.data();
                        if (userData.role === 'admin') {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            window.location.href = 'customer-dashboard.html';
                        }
                    }
                }).catch(error => {
                    console.error('获取用户数据失败:', error);
                });
            }
        });

        console.log('✅ 首页已加载');
    </script>
</body>
</html>

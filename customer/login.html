<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车主登录 - 汽车服务管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-user"></i>
                <h1>车主登录</h1>
                <p>还没有账号？ <a href="register.html">立即注册</a></p>
            </div>
            
            <div id="loginError" class="error-message" style="display: none;"></div>
            
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label>邮箱</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="请输入邮箱" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="请输入密码" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('password')"></i>
                    </div>
                </div>
                
                <div class="form-footer">
                    <label class="remember-me">
                        <input type="checkbox" id="remember"> 记住我
                    </label>
                    <a href="#" class="forgot-password" onclick="showForgotPassword()">忘记密码？</a>
                </div>
                
                <button type="submit" class="btn" id="loginBtn">登录</button>
                
                <div class="divider">
                    <span>或使用</span>
                </div>
                
                <div class="social-login">
                    <div class="social-btn" onclick="socialLogin('google')">
                        <i class="fab fa-google"></i>
                    </div>
                    <div class="social-btn" onclick="socialLogin('wechat')">
                        <i class="fab fa-weixin"></i>
                    </div>
                </div>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="../index.html" style="color: #667eea; text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> 返回首页
                </a>
            </div>
        </div>
    </div>
    
    <!-- 忘记密码模态框 -->
    <div id="forgotModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px;">
            <h3 style="margin-bottom: 20px;">重置密码</h3>
            <div id="resetError" class="error-message" style="display: none;"></div>
            <div id="resetSuccess" class="success-message" style="display: none;"></div>
            <form id="resetForm">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="resetEmail" placeholder="请输入注册邮箱" required style="width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 5px;">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn" style="flex: 1;">发送重置邮件</button>
                    <button type="button" class="btn" style="flex: 1; background: #e0e0e0; color: #333;" onclick="closeForgotModal()">取消</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth-helper.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            if (!validateEmail(email)) {
                showError('loginError', '请输入有效的邮箱');
                return;
            }
            
            loginBtn.innerHTML = '<span class="loading-spinner"></span> 登录中...';
            loginBtn.disabled = true;
            
            try {
                // 设置持久化
                if (remember) {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                } else {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
                }
                
                // 登录
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // 检查用户角色
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                if (!userDoc.exists) {
                    throw new Error('用户数据不存在');
                }
                
                const userData = userDoc.data();
                
                if (userData.role !== 'customer') {
                    await auth.signOut();
                    throw new Error('此账号不是车主账号');
                }
                
                // 更新最后登录时间
                await db.collection('users').doc(user.uid).update({
                    lastLogin: new Date().toISOString()
                });
                
                // 跳转到客户仪表板
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                console.error('Login error:', error);
                
                let errorMessage = '登录失败';
                switch(error.code) {
                    case 'auth/user-not-found':
                        errorMessage = '用户不存在';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = '密码错误';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = '邮箱格式不正确';
                        break;
                    default:
                        errorMessage = error.message;
                }
                
                showError('loginError', errorMessage);
                
                loginBtn.innerHTML = '登录';
                loginBtn.disabled = false;
            }
        });
        
        function showForgotPassword() {
            document.getElementById('forgotModal').style.display = 'flex';
        }
        
        function closeForgotModal() {
            document.getElementById('forgotModal').style.display = 'none';
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('resetEmail').value;
            
            try {
                await auth.sendPasswordResetEmail(email);
                showSuccess('resetSuccess', '重置邮件已发送，请检查邮箱');
                
                setTimeout(() => {
                    closeForgotModal();
                }, 3000);
                
            } catch (error) {
                console.error('Reset error:', error);
                
                let errorMessage = '发送失败';
                if (error.code === 'auth/user-not-found') {
                    errorMessage = '用户不存在';
                }
                
                showError('resetError', errorMessage);
            }
        });
        
        function socialLogin(provider) {
            alert(provider + '登录功能开发中...');
        }
    </script>
</body>
</html>

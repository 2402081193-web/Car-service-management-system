<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的爱车 - 客户中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <div style="background: white; padding: 15px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-car" style="font-size: 1.8rem; color: #3b82f6;"></i>
            <span style="font-size: 1.3rem; font-weight: 600;">我的爱车服务</span>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span id="userName">加载中...</span>
            <button class="btn btn-danger" onclick="logout()">退出</button>
        </div>
    </div>

    <div class="customer-container" style="display: flex; gap: 25px;">
        <!-- 左侧菜单 -->
        <div style="width: 280px;">
            <div class="profile-sidebar">
                <div class="profile-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <h3 style="text-align: center; margin: 10px 0;" id="profileName">加载中...</h3>
                <p style="text-align: center; color: #666;" id="profileEmail"></p>

                <ul class="sidebar-menu" style="margin-top: 30px;">
                    <li class="active" data-page="my-cars">
                        <i class="fas fa-car"></i> 我的爱车
                    </li>
                    <li data-page="my-appointments">
                        <i class="fas fa-calendar-check"></i> 我的预约
                    </li>
                    <li data-page="my-services">
                        <i class="fas fa-tools"></i> 服务历史
                    </li>
                    <li data-page="my-payments">
                        <i class="fas fa-credit-card"></i> 支付记录
                    </li>
                </ul>
            </div>
        </div>

        <!-- 右侧内容 -->
        <div style="flex: 1;">
            <div id="customerContent"></div>
        </div>
    </div>

    <!-- 预约模态框 -->
    <div id="bookingModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px;">
            <h3 style="margin-bottom: 20px;">预约服务</h3>
            <form id="bookingForm">
                <div class="form-group">
                    <label>选择车辆</label>
                    <select id="bookingCarId" required>
                        <option value="">请选择</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>服务类型</label>
                    <select id="bookingServiceType" required>
                        <option value="保养">保养</option>
                        <option value="维修">维修</option>
                        <option value="检测">检测</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>预约日期</label>
                    <input type="date" id="bookingDate" required>
                </div>
                <div class="form-group">
                    <label>预约时间</label>
                    <input type="time" id="bookingTime" required>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="bookingNotes" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">确认预约</button>
                    <button type="button" class="btn" onclick="closeBookingModal()" style="flex: 1;">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/customer/customer.js"></script>
    <script src="js/customer/my-cars.js"></script>
    <script src="js/customer/my-appointments.js"></script>
    <script src="js/customer/my-services.js"></script>
    <script src="js/customer/my-payments.js"></script>
</body>
</html>

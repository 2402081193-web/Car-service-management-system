<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的爱车 - 客户中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <!-- 添加 favicon 避免 404 错误 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
</head>
<body>
    <!-- 导航栏 -->
    <div class="navbar">
        <div class="navbar-brand">
            <i class="fas fa-car"></i>
            <span>我的爱车服务</span>
        </div>
        <div class="user-info">
            <span class="user-name" id="userName">加载中...</span>
            <button class="btn btn-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> 退出
            </button>
        </div>
    </div>

    <div class="customer-container">
        <!-- 左侧菜单 -->
        <div class="profile-sidebar">
            <div class="profile-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <h3 class="profile-name" id="profileName">加载中...</h3>
            <p class="profile-email" id="profileEmail"></p>

            <ul class="profile-menu">
                <li class="active" data-page="my-cars">
                    <i class="fas fa-car"></i> 我的爱车
                </li>
                <li data-page="my-appointments">
                    <i class="fas fa-calendar-check"></i> 我的预约
                </li>
                <li data-page="my-services">
                    <i class="fas fa-tools"></i> 服务历史
                </li>
                <li data-page="my-payments">
                    <i class="fas fa-credit-card"></i> 支付记录
                </li>
            </ul>
        </div>

        <!-- 右侧内容 -->
        <div class="content-area">
            <!-- 欢迎卡片（默认显示） -->
            <div id="welcomeCard" class="welcome-card">
                <h2>欢迎回来，<span id="welcomeName">尊贵的车主</span></h2>
                <p>在这里您可以管理您的爱车、预约服务、查看历史记录等。</p>
                <div class="quick-actions">
                    <button class="btn btn-primary" onclick="showBookingModal()">
                        <i class="fas fa-calendar-plus"></i> 快速预约
                    </button>
                    <button class="btn btn-outline" onclick="loadMyCars()">
                        <i class="fas fa-car"></i> 查看爱车
                    </button>
                </div>
            </div>

            <!-- 内容容器 -->
            <div id="customerContent" style="display: none;"></div>
        </div>
    </div>

    <!-- 预约模态框 -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>预约服务</h3>
                <span class="close" onclick="closeBookingModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="bookingForm">
                    <div class="form-group">
                        <label>选择车辆</label>
                        <select id="bookingCarId" required>
                            <option value="">请选择</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>服务类型</label>
                        <select id="bookingServiceType" required>
                            <option value="保养">常规保养</option>
                            <option value="维修">维修</option>
                            <option value="检测">检测</option>
                            <option value="美容">美容</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>预约日期</label>
                        <input type="date" id="bookingDate" required>
                    </div>
                    <div class="form-group">
                        <label>预约时间</label>
                        <input type="time" id="bookingTime" required>
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <textarea id="bookingNotes" rows="3" placeholder="例如：需要更换机油、检查刹车等"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="submitBooking()">确认预约</button>
                <button type="button" class="btn btn-outline" onclick="closeBookingModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- 添加车辆模态框 -->
    <div class="modal" id="addCarModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加爱车</h3>
                <span class="close" onclick="closeAddCarModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addCarForm">
                    <div class="form-group">
                        <label>车牌号</label>
                        <input type="text" id="carPlate" placeholder="例如: 京A12345" required>
                    </div>
                    <div class="form-group">
                        <label>车型</label>
                        <input type="text" id="carModel" placeholder="例如: 特斯拉Model 3" required>
                    </div>
                    <div class="form-group">
                        <label>品牌</label>
                        <input type="text" id="carBrand" placeholder="例如: 特斯拉">
                    </div>
                    <div class="form-group">
                        <label>颜色</label>
                        <input type="text" id="carColor" placeholder="例如: 白色">
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <textarea id="carNotes" rows="2" placeholder="例如: 购车日期、特殊配置等"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="submitAddCar()">添加</button>
                <button type="button" class="btn btn-outline" onclick="closeAddCarModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/customer/customer.js"></script>
    <script src="js/customer/my-cars.js"></script>
    <script src="js/customer/my-appointments.js"></script>
    <script src="js/customer/my-services.js"></script>
    <script src="js/customer/my-payments.js"></script>
</body>
</html>

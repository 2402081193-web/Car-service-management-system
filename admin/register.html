<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员注册 - 汽车服务管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-user-tie"></i>
                <h2>管理员注册</h2>
                <p>已有账号？ <a href="login.html">立即登录</a></p>
            </div>
            
            <div id="registerError" class="alert alert-danger" style="display: none;"></div>
            
            <div class="alert alert-info">
                <i class="fas fa-info-circle"></i>
                管理员注册需要输入注册密码，请联系系统管理员获取
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>管理员注册密码 <span style="color: red;">*</span></label>
                    <input type="password" id="adminPassword" class="form-control" placeholder="请输入管理员注册密码" required>
                    <small class="form-text text-muted">默认密码: ADMIN2024</small>
                </div>
                
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="name" class="form-control" placeholder="请输入用户名" required>
                </div>
                
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" class="form-control" placeholder="请输入邮箱" required>
                </div>
                
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="phone" class="form-control" placeholder="请输入手机号">
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
                    <small class="form-text text-muted">密码长度至少6位</small>
                </div>
                
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="请再次输入密码" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="registerBtn">注册</button>
            </form>
            
            <div class="login-footer">
                <a href="../index.html"><i class="fas fa-arrow-left"></i> 返回首页</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const adminPassword = document.getElementById('adminPassword').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // 验证管理员注册密码
            if (adminPassword !== ADMIN_REGISTER_PASSWORD) {
                document.getElementById('registerError').innerHTML = `<i class="fas fa-exclamation-circle"></i> 管理员注册密码错误`;
                document.getElementById('registerError').style.display = 'flex';
                return;
            }
            
            // 验证密码
            if (password.length < 6) {
                document.getElementById('registerError').innerHTML = `<i class="fas fa-exclamation-circle"></i> 密码长度至少6位`;
                document.getElementById('registerError').style.display = 'flex';
                return;
            }
            
            if (password !== confirmPassword) {
                document.getElementById('registerError').innerHTML = `<i class="fas fa-exclamation-circle"></i> 两次输入的密码不一致`;
                document.getElementById('registerError').style.display = 'flex';
                return;
            }
            
            registerBtn.innerHTML = '<span class="spinner"></span> 注册中...';
            registerBtn.disabled = true;
            
            try {
                // 创建用户
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // 更新用户资料
                await user.updateProfile({
                    displayName: name
                });
                
                // 保存用户信息到数据库
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    name: name,
                    email: email,
                    phone: phone || '',
                    role: 'admin',
                    status: 'active',
                    createdBy: 'admin_registration',
                    createdAt: new Date().toISOString()
                });
                
                // 跳转到管理员仪表板
                window.location.href = '../admin-dashboard.html';
                
            } catch (error) {
                console.error('Registration error:', error);
                
                let errorMessage = '注册失败';
                switch(error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = '邮箱已被注册';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = '邮箱格式不正确';
                        break;
                    case 'auth/weak-password':
                        errorMessage = '密码强度太弱';
                        break;
                    default:
                        errorMessage = error.message;
                }
                
                document.getElementById('registerError').innerHTML = `<i class="fas fa-exclamation-circle"></i> ${errorMessage}`;
                document.getElementById('registerError').style.display = 'flex';
                
                registerBtn.innerHTML = '注册';
                registerBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

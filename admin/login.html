<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 汽车服务管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-user-tie"></i>
                <h2>管理员登录</h2>
                <p>还没有账号？ <a href="register.html">立即注册</a></p>
            </div>
            
            <div id="loginError" class="alert alert-danger" style="display: none;"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" class="form-control" placeholder="请输入管理员邮箱" required>
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
                </div>
                
                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember"> 记住我
                    </label>
                    <a href="#" class="forgot-link" onclick="showForgotPassword()">忘记密码？</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登录</button>
            </form>
            
            <div class="login-footer">
                <a href="../index.html"><i class="fas fa-arrow-left"></i> 返回首页</a>
            </div>
        </div>
    </div>

    <!-- 忘记密码模态框 -->
    <div class="modal" id="forgotModal">
        <div class="modal-content" style="max-width: 400px;">
            <h3>重置密码</h3>
            <div id="resetError" class="alert alert-danger" style="display: none;"></div>
            <div id="resetSuccess" class="alert alert-success" style="display: none;"></div>
            <form id="resetForm">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="resetEmail" class="form-control" placeholder="请输入注册邮箱" required>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">发送重置邮件</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeForgotModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            loginBtn.innerHTML = '<span class="spinner"></span> 登录中...';
            loginBtn.disabled = true;
            
            try {
                // 设置持久化
                if (remember) {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                } else {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
                }
                
                // 登录
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // 检查用户角色
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                if (!userDoc.exists) {
                    throw new Error('用户数据不存在');
                }
                
                const userData = userDoc.data();
                
                if (userData.role !== 'admin') {
                    await auth.signOut();
                    throw new Error('此账号不是管理员账号');
                }
                
                // 更新最后登录时间
                await db.collection('users').doc(user.uid).update({
                    lastLogin: new Date().toISOString()
                });
                
                // 跳转到管理员仪表板
                window.location.href = '../admin-dashboard.html';
                
            } catch (error) {
                console.error('Login error:', error);
                
                let errorMessage = '登录失败';
                switch(error.code) {
                    case 'auth/user-not-found':
                        errorMessage = '用户不存在';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = '密码错误';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = '邮箱格式不正确';
                        break;
                    default:
                        errorMessage = error.message;
                }
                
                document.getElementById('loginError').innerHTML = `<i class="fas fa-exclamation-circle"></i> ${errorMessage}`;
                document.getElementById('loginError').style.display = 'flex';
                
                loginBtn.innerHTML = '登录';
                loginBtn.disabled = false;
            }
        });
        
        function showForgotPassword() {
            document.getElementById('forgotModal').classList.add('show');
        }
        
        function closeForgotModal() {
            document.getElementById('forgotModal').classList.remove('show');
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('resetEmail').value;
            
            try {
                await auth.sendPasswordResetEmail(email);
                document.getElementById('resetSuccess').innerHTML = `<i class="fas fa-check-circle"></i> 重置邮件已发送，请检查邮箱`;
                document.getElementById('resetSuccess').style.display = 'flex';
                
                setTimeout(() => {
                    closeForgotModal();
                }, 3000);
                
            } catch (error) {
                console.error('Reset error:', error);
                
                let errorMessage = '发送失败';
                if (error.code === 'auth/user-not-found') {
                    errorMessage = '用户不存在';
                }
                
                document.getElementById('resetError').innerHTML = `<i class="fas fa-exclamation-circle"></i> ${errorMessage}`;
                document.getElementById('resetError').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
